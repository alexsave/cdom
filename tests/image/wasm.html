<!doctype html><html><head><meta charset="utf-8"><title>image</title></head><body><div id="m"></div>
<script>
/*CDOM_SHIM*/
</script>
<script>
// tools/image.mjs drives this page (tests/image/wasm.c): run(input, box w, box h, expected) answers the status, the size
// and the first pixel that differs from the expected .rgba (-1: none).
cdom.start(/*CDOM_WASM*/, 'm').then((x) => { window.X = x; window.READY = true; });
async function bytesOf(url) { return new Uint8Array(await (await fetch(url)).arrayBuffer()); }
window.run = async (input, bw, bh, expected) => {
  const data = await bytesOf(input);
  const p = X.room(data.length);
  if (!p) return { status: 'no room for the file' };
  new Uint8Array(X.memory.buffer, p, data.length).set(data);
  const status = X.resize(p, data.length, bw, bh);
  const o = new Uint32Array(X.memory.buffer, X.out(), 3);
  const w = o[0], h = o[1], rgba = o[2];
  let diff = -2;
  if (status === 0 && expected) {
    const want = await bytesOf(expected), got = new Uint8Array(X.memory.buffer, rgba, w * h * 4);
    diff = want.length !== got.length ? -3 : -1;
    for (let i = 0; diff === -1 && i < got.length; i++) if (got[i] !== want[i]) diff = i >> 2;
  }
  X.drop(rgba);
  X.drop(p);
  return { status, w, h, diff, pages: X.memory.buffer.byteLength >> 16, sp: X.sp() };
};
// run with the image's FNV-1a (and the SIMD steps wired), for the SIMD builds' C against SIMD (tools/image.mjs): off 1 runs libjpeg's C
// routines, mode bit 0 the ifast IDCT and bit 1 merged upsampling
window.hashRun = async (input, bw, bh, off, mode) => {
  X.set_off(off); X.set_mode(mode);   // set_off also clears the wired mask: it is this run's alone
  const data = await bytesOf(input);
  const p = X.room(data.length);
  new Uint8Array(X.memory.buffer, p, data.length).set(data);
  const status = X.resize(p, data.length, bw, bh);
  const o = new Uint32Array(X.memory.buffer, X.out(), 3);
  const w = o[0], h = o[1], rgba = o[2];
  let hash = 2166136261;
  if (status === 0) { const got = new Uint8Array(X.memory.buffer, rgba, w * h * 4); for (let i = 0; i < got.length; i++) hash = Math.imul(hash ^ got[i], 16777619); }
  const wired = X.wired();
  X.drop(rgba); X.drop(p); X.set_off(0); X.set_mode(0);
  return { status, w, h, hash: hash >>> 0, wired };
};
</script></body></html>
