<HTML>
<HEAD>
<TITLE>cdom probe-js1</TITLE>
<SCRIPT LANGUAGE="JavaScript">
var n = 0;
var TAG = "" + location.search;
TAG = TAG.substring(1, TAG.length);
if (TAG == "") { TAG = "x"; }
function mark(name, v) {
  n = n + 1;
  document.write('<IMG SRC="/mark/' + TAG + '/p-' + n + '-' + name + '-' + escape("" + v) + '" WIDTH=1 HEIGHT=1>');
}
var late_n = 0;
function late(name, v) {
  late_n = late_n + 1;
  var u = '/mark/' + TAG + '/p-L' + late_n + '-' + name + '-' + escape("" + v);
  if (window.Image) {
    var im = new Image();
    im.src = u;
  } else {
    document.write('<IMG SRC="' + u + '" WIDTH=1 HEIGHT=1>');
  }
}
</SCRIPT>
</HEAD>
<BODY>
<H3>cdom probe-js1</H3>
<P>Reports to /mark/ as it loads.
<FORM NAME="f0"><INPUT TYPE=text NAME="t0" VALUE="v0"></FORM>
<SCRIPT LANGUAGE="JavaScript">
mark("speedConcat2000", "start");
function T(){ var d = new Date(); return d.getTime(); } function t(){ var s = ''; var i; var a = T(); for (i = 0; i < 2000; i++) { s = s + 'a'; } return (T() - a) + 'ms len=' + s.length; }
mark("speedConcat2000", t());
mark("speedConcat2000", "ok");
</SCRIPT>
<SCRIPT LANGUAGE="JavaScript">
mark("done", "end");
</SCRIPT>
</BODY>
</HTML>
