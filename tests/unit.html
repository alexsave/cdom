<!doctype html><html><head><meta charset="utf-8"><title>unit</title></head><body><div id="m"></div>
<script src="cdom.js"></script><script>
// Runs tests/unit.c's cases and checks them; tools/unit.mjs reads window.RESULT, then drives the
// resize and the network from outside. The imports are wrapped only to see what crosses after an
// entry returns (the auto-flush check).
const errors = [], passed = [], trace = [];
let tracing = false;
const real = WebAssembly.instantiateStreaming;
WebAssembly.instantiateStreaming = (res, imp) => {
  for (const k of ['strings', 'walk']) { const f = imp.cdom[k]; imp.cdom[k] = (...a) => { if (tracing) trace.push(k); return f(...a); }; }
  return real(res, imp);
};
const $ = (s) => document.querySelector(s);
const SVG = 'http://www.w3.org/2000/svg', HTML = 'http://www.w3.org/1999/xhtml';
function check(name, fn) {
  try { const r = fn(); if (r !== true) errors.push(`${name}: ${r}`); else passed.push(name); }
  catch (e) { errors.push(`${name}: threw ${e}`); }
}
const until = async (f, ms = 3000) => { for (let i = 0; i < ms / 10; i++) { if (f()) return true; await new Promise((r) => setTimeout(r, 10)); } return false; };

cdom.start('unit.wasm', 'm').then(async (x) => {
  window.__x = x;
  check('clone inside an open element is its child', () => {
    x.t_clone_inside();
    const got = [...$('#clone').childNodes].map((n) => n.outerHTML).join('');
    return got === '<p><b>one</b><b>two</b></p><b>two</b>' || got;
  });
  check('svg and its descendants in the SVG namespace, the namespace popped on close', () => {
    x.t_svg();
    const ns = (s) => $('#svg ' + s).namespaceURI;
    const g2 = $('#svg svg').children[1];   // the clone of an HTML template stays HTML
    const r = [ns('div') === HTML, ns('svg') === SVG, ns('svg > g') === SVG, ns('path') === SVG, ns('circle') === SVG,
      ns('span') === HTML, g2.namespaceURI === HTML, $('#svg path').getTotalLength() > 5];
    return r.every(Boolean) || JSON.stringify(r);
  });
  check('cd_name_open names the element, not its last child', () => {
    x.t_name_open();
    return $('#nameopen > div').className === 'named' || $('#nameopen').innerHTML;
  });
  check('cd_set_style and cd_set_style_num; 400 transient values leave the string table alone', () => {
    const grew = x.t_style(400);
    const st = $('#style > div').style;
    const r = [st.left === '399px', st.top === '399.5px', st.color === 'red', st.width === '12.25em', st.opacity === '0.5',
      $('#style > div').dataset.t === 'one-off é', grew === 10];
    return r.every(Boolean) || JSON.stringify(r) + ' grew ' + grew;
  });
  check('a transient used after another op crossed traps', () => {
    try { x.t_tmp_stale(); return 'no trap'; } catch (e) { return e instanceof WebAssembly.RuntimeError || String(e); }
  });
  check('freeing a free id traps', () => {
    try { x.t_free_twice(); return 'no trap'; } catch (e) { return e instanceof WebAssembly.RuntimeError || String(e); }
  });
  check('CD_LIT: one interned id per call site', () => x.t_lit() === 1 || 'wrong ids');
  check('cd_fmt matches String(v / 10 ** d) + unit', () => {
    const U = ['', 'px', '%', 'deg', 'em', 'rem', 'vw', 'vh', 'ms', 's', 'rad'];
    const vals = [0, 1, -1, 5, -5, 9, 10, 99, 100, 101, 1000, 12345, -12345, 99999, 100000, 2147483647, -2147483647, -2147483648];
    for (let v = -30000; v <= 30000; v += 7) vals.push(v);
    for (let v = 1; v < 2147483647 / 3; v = v * 3 + 1) vals.push(v, -v);
    let n = 0;
    for (const v of vals) for (let d = 0; d <= 6; d++) for (const u of [0, 1, 2, 3]) {
      const len = x.t_fmt(v, d, u);
      const got = new TextDecoder().decode(new Uint8Array(x.memory.buffer, x.t_fmt_buf(), len));
      const want = String(v / 10 ** d) + U[u];
      if (got !== want) return `cd_fmt(${v}, ${d}, ${u}) = ${got}, JS ${want}`;
      n++;
    }
    for (const v of [0, 0.5, 22.5, 207.33333333, -3.14159, 49.99999999999999, 1e-5, -1e-5, 12345.67891]) {
      const len = x.t_fmt_len(v, 1);
      const got = new TextDecoder().decode(new Uint8Array(x.memory.buffer, x.t_fmt_buf(), len));
      const want = String(Math.sign(v) * Math.round(Math.abs(v) * 1e4) / 1e4 || 0) + 'px';
      if (got !== want) return `cd_fmt_len(${v}) = ${got}, JS ${want}`;
    }
    return n > 30000 || 'too few';
  });
  check('a keyed list with a fixed sibling after it: tail inserts land before the sibling', () => {
    const seen = [];
    for (let step = 0; step < 5; step++) { x.t_tail(step); seen.push([...$('#tail ul').children].map((e) => e.textContent).join(',')); }
    const want = ['1,2,end', '1,2,3,end', '3,1,2,4,end', '4,end', 'end'];
    return seen.join('|') === want.join('|') || seen.join('|');
  });
  check('lists and regions filled and taken away 4000 times: ids and nodes flat', () => {
    x.t_leak(200);
    const ids = x.t_ids_live(), high = x.t_ids_high(), nodes = $('#leak').querySelectorAll('*').length;
    x.t_leak(4000);
    const r = [x.t_ids_live(), x.t_ids_high(), $('#leak').querySelectorAll('*').length];
    return (r[0] === ids && r[1] === high && r[2] === nodes) || `live ${ids}->${r[0]}, high ${high}->${r[1]}, nodes ${nodes}->${r[2]}`;
  });
  // Timers, frames and the auto-flush: the timer hook leaves a string and a walk pending and calls no flush.
  x.t_time();
  tracing = true;
  const fired = await until(() => $('#time i').textContent === '41' && $('#time i + i').textContent === '42');
  tracing = false;
  check('a timer and a frame answer through their hooks', () => fired || $('#time').textContent);
  check('cd_now is performance.now', () => { const a = performance.now(), c = x.t_now(), b = performance.now();
    return (a <= c && c <= b && x.t_raf_t() > 0 && x.t_raf_t() <= a) || `${a} ${c} ${b} raf ${x.t_raf_t()}`; });
  check('the timer and frame exports flush what their hooks left pending', () =>
    (trace.includes('strings') && trace.includes('walk') && x.t_stale() === 0) || JSON.stringify(trace) + ' stale ' + x.t_stale());
  x.t_window();
  check('the viewport, read from C', () => (x.t_viewport(0) === innerWidth && x.t_viewport(1) === innerHeight && x.t_viewport(2) === +document.hidden && x.t_viewport(6) === Math.round(devicePixelRatio * 100)) || 'wrong');
  document.dispatchEvent(new Event('visibilitychange'));
  check('visibilitychange arrives through the event path', () => x.t_viewport(5) === +document.hidden || x.t_viewport(5));
  // An image: the pixels C wrote, encoded, their bytes back in C, then set as a url.
  x.t_image();
  const landed = await until(() => x.t_loaded(0) === 1);
  let got = null;
  if (landed) {
    const url = $('#image > div').style.backgroundImage.slice(5, -2);
    const img = new Image(); img.src = url;
    try { await img.decode();
      const cv = document.createElement('canvas'); cv.width = 3; cv.height = 2;
      const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0);
      got = [...cx.getImageData(0, 0, 3, 2).data]; } catch (e) { got = 'not decodable: ' + e.name; }
  }
  check('cd_encode_image and cd_set_image_bytes: the pixels as a PNG in C, then a CSS url', () => {
    const want = []; for (let i = 0; i < 6; i++) want.push(40 * i, 255 - 30 * i, 7 * i, 255);
    return (landed && x.t_loaded(1) === 77 && JSON.stringify(got) === JSON.stringify(want) && x.t_stale() === 0)
      || `landed ${landed} key ${x.t_loaded(1)} pixels ${JSON.stringify(got)}`;
  });
  x.t_image_rgb();
  const rgbDone = await until(() => x.t_rgb_len() > 0);
  let rgbGot = null;
  if (rgbDone) { try { const bm = await createImageBitmap(new Blob([new Uint8Array(x.memory.buffer, x.t_rgb_png(), x.t_rgb_len()).slice()]));
    const cv = new OffscreenCanvas(5, 4), cx = cv.getContext('2d'); cx.drawImage(bm, 0, 0); rgbGot = [bm.width, bm.height, ...cx.getImageData(0, 0, 5, 4).data]; } catch (e) { rgbGot = String(e); } }
  check('cd_encode_image_in with RGB: the same picture, opaque, at its place in a bigger one', () => {
    const want = [5, 4]; for (let y = 0; y < 4; y++) for (let x = 0; x < 5; x++) { const i = (y - 1) * 3 + x - 1;
      want.push(...(x >= 1 && x < 4 && y >= 1 && y < 3 ? [40 * i, 255 - 30 * i, 7 * i, 255] : [0, 0, 0, 0])); }
    return JSON.stringify(rgbGot) === JSON.stringify(want) || `got ${JSON.stringify(rgbGot)}`;
  });
  // The store: put then get round-trips the bytes; a missing key answers -1; so does a get whose
  // deadline passes first (a readwrite transaction held open on the store keeps the read waiting).
  x.t_store_put();
  await new Promise((r) => setTimeout(r, 100));
  x.t_store_get(1, 1, 1500); x.t_store_get(2, 0, 1500);
  await until(() => x.t_store(1, 0) !== -2 && x.t_store(2, 0) !== -2);
  const want = [9, 1, 250, 3, 7].reduce((s, b) => (Math.imul(s, 31) + b) >>> 0, 0) | 0;
  check('cd_store: a put, then a get, gives the same bytes back', () => (x.t_store(1, 0) === 5 && x.t_store(1, 1) === want && x.t_stale() === 0) || `len ${x.t_store(1, 0)} sum ${x.t_store(1, 1)}`);
  check('cd_store: a missing key answers -1', () => x.t_store(2, 0) === -1 || x.t_store(2, 0));
  const d = await new Promise((r, j) => { const q = indexedDB.open('cdom', 1); q.onsuccess = () => r(q.result); q.onerror = j; });
  const tx = d.transaction('kv', 'readwrite'), os = tx.objectStore('kv'), t0 = performance.now();
  const busy = () => { if (performance.now() - t0 < 400) os.put(new Uint8Array(1), 'unit-busy').onsuccess = busy; };
  busy();
  x.t_store_get(3, 1, 50);
  const early = await until(() => x.t_store(3, 0) !== -2, 300);
  check('cd_store: a get not answered by its deadline answers -1', () => (early && x.t_store(3, 0) === -1 && performance.now() - t0 < 300) || `answered ${early} with ${x.t_store(3, 0)}`);
  await new Promise((r) => { tx.oncomplete = r; });
}).catch((e) => errors.push('start: ' + e)).finally(() => { window.RESULT = { errors, passed }; });
</script></body></html>
