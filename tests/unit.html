    return (traps(() => x.t_audio_play_unloaded(9)) && traps(() => x.t_audio_free(9))) || 'no trap';
  });
  // The lock: a synthetic gesture asks for a resume, but only a real one unlocks the context.
  const asked = heard.resumes;
  document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
  await sleep(100);
  check('cd_audio_state is LOCKED until a gesture; a synthetic one asks the context to resume and leaves it locked', () =>
    (lockedAtStart === 0 && heard.resumes === asked + 1 && x.t_audio_state() === 0) || `state ${lockedAtStart} then ${x.t_audio_state()}, resumes ${heard.resumes - asked}`);
  window.WANT_GESTURE = true;
  const unlocked = await until(() => x.t_audio_state() === 1 && x.t_audio_states() % 10 === 2, 5000); // the state changes, then its event comes
  check('a real gesture (a click from tools/unit.mjs) unlocks it: RUNNING, and cd_on_audio_state hears it', () =>
    (unlocked && x.t_audio_states() % 10 === 2) || `state ${x.t_audio_state()}, heard ${x.t_audio_states()}`);
  const short = x.t_audio_loaded(1), long = x.t_audio_loaded(3), tick = x.t_audio_loaded(5);
  // Playback: the graph a voice makes, then the ended answer once it played out.
  const master = heard.edges.find(([, to]) => to instanceof AudioDestinationNode)[0];
  const v1 = x.t_audio_play(short, 0.5, 1, 0);
  const source = heard.sources.at(-1), gain = heard.gains.at(-1);
  const edge = (a, b) => heard.edges.some(([from, to]) => from === a && to === b);
  const graph = [edge(source, gain), edge(gain, master), source.buffer && near(source.buffer.duration, 0.2), near(gain.gain.value, 0.5), source.playbackRate.value === 1];
  await until(() => x.t_audio_took(v1) > 0);
  check('cd_audio_play: clip, source, voice gain, master, speakers; cd_on_audio_ended once it played out, without a cd_flush, and the voice let go', () => {
    const r = [...graph, x.t_audio_took(v1) >= 180, x.t_audio_took(v1) < 1000, heard.cut.includes(gain), x.t_stale() === 0];
    return r.every(Boolean) || JSON.stringify(r) + ' took ' + x.t_audio_took(v1);
  });
  check('a voice whose ended answer came: the shim holds nothing of it, and C ignores a stop or a gain on its id', () => {
    let empty = false;
    try { shim.audio_stop(v1); } catch (e) { empty = e instanceof TypeError; }
    try { x.t_audio_stop(v1); x.t_audio_gain(v1, 1); } catch (e) { return 'threw ' + e; }
    return empty || 'the shim still holds the voice';
  });
  // A voice at a time on cd_now()'s clock, and one at a rate.
  const v2 = x.t_audio_play(short, 1, 1, 300);
  await until(() => x.t_audio_took(v2) > 0);
  check('cd_audio_play at a time on cd_now()\'s clock: it starts then, and ends a clip later', () =>
    (x.t_audio_took(v2) >= 480 && x.t_audio_took(v2) < 1500) || 'took ' + x.t_audio_took(v2));
  const v3 = x.t_audio_play(long, 1, 4, 0);
  const rate = heard.sources.at(-1).playbackRate.value;
  await until(() => x.t_audio_took(v3) > 0);
  check('cd_audio_play at rate 4: a one-second clip plays in a quarter of one', () =>
    (rate === 4 && x.t_audio_took(v3) >= 200 && x.t_audio_took(v3) < 700) || `rate ${rate}, took ${x.t_audio_took(v3)}`);
  // Stopping: a voice that plays, and one that has not started.
  const v4 = x.t_audio_play(long, 1, 1, 0);
  const v5 = x.t_audio_play(long, 1, 1, 500);
  await sleep(50);
  x.t_audio_stop(v4); x.t_audio_stop(v5);
  await until(() => x.t_audio_took(v4) > 0 && x.t_audio_took(v5) > 0);
  check('cd_audio_stop: a playing voice and one not started yet both end at once', () =>
    (x.t_audio_took(v4) > 0 && x.t_audio_took(v4) < 300 && x.t_audio_took(v5) > 0 && x.t_audio_took(v5) < 300) || `took ${x.t_audio_took(v4)} and ${x.t_audio_took(v5)}`);
  // Gain and mute: the voice's gain node and the master, eased to what C set.
  const v6 = x.t_audio_play(long, 0.5, 1, 0);
  const g6 = heard.gains.at(-1);
  x.t_audio_gain(v6, 0.25);
  x.t_audio_master(0.8);
  const eased = await until(() => near(g6.gain.value, 0.25) && near(master.gain.value, 0.8), 1000);
  x.t_audio_mute(1);
  const muted = await until(() => near(master.gain.value, 0), 1000);
  x.t_audio_master(0.3);
  await sleep(60);
  const stillMuted = near(master.gain.value, 0);
  x.t_audio_mute(0);
  const unmuted = await until(() => near(master.gain.value, 0.3), 1000);
  x.t_audio_master(1);
  x.t_audio_stop(v6);
  check('cd_audio_set_gain, cd_audio_master and cd_audio_mute: the voice\'s gain node and the master follow, and unmuting brings back the master set while muted', () =>
    (eased && muted && stillMuted && unmuted) || JSON.stringify([eased, muted, stillMuted, unmuted]) + ` ${g6.gain.value} ${master.gain.value}`);
  // Ids: 20 voices one after another, each played from the last one's ended hook, all get one id.
  await until(() => x.t_audio_took(v6) > 0);
  x.t_audio_chain(tick, 20);
  await until(() => x.t_audio_chained(0) === 20, 3000);
  check('20 voices played one after another reuse one id', () =>
    (x.t_audio_chained(0) === 20 && x.t_audio_chained(1) === x.t_audio_chained(2)) || [0, 1, 2].map(x.t_audio_chained).join(' '));
  // Hidden, the context suspends and a voice waits; shown, it resumes and the voice plays.
  Object.defineProperty(document, 'hidden', { configurable: true, get: () => true });
  document.dispatchEvent(new Event('visibilitychange'));
  const suspended = await until(() => x.t_audio_state() === 2 && x.t_audio_states() % 10 === 3, 1000);
  const v7 = x.t_audio_play(tick, 1, 1, 0);
  await sleep(300);
  const waited = x.t_audio_took(v7) === 0;
  delete document.hidden;
  document.dispatchEvent(new Event('visibilitychange'));
  const resumed = await until(() => x.t_audio_state() === 1 && x.t_audio_states() % 100 === 32, 1000);
  await until(() => x.t_audio_took(v7) > 0, 1000);
  check('hidden, the context suspends (SUSPENDED, heard by C) and a voice waits; shown, it resumes and the voice plays', () =>
    (suspended && waited && resumed && x.t_audio_took(v7) >= 300 && x.t_audio_states() % 100 === 32) || JSON.stringify([suspended, waited, resumed]) + ` took ${x.t_audio_took(v7)} heard ${x.t_audio_states()}`);

  // Random bytes (15 in unit.c): what getRandomValues was asked to fill, and what C finds written.
  const asks = [];
  const realRandom = Crypto.prototype.getRandomValues;
  Crypto.prototype.getRandomValues = function (view) { asks.push(view.length); return realRandom.call(this, view); };
  check('cd_random_bytes: 200,000 bytes in chunks of 65536, every chunk random, nothing written past either end', () => {
    const status = x.t_random(200000);
    const zeros = [0, 1, 2, 3].map(x.t_random_zeros);
    const sizes = [65536, 65536, 65536, 3392];
    const r = [status === 1, asks.join() === sizes.join(), zeros.every((z, k) => z * 32 < sizes[k]), x.t_random_guards() === 1];
    return r.every(Boolean) || JSON.stringify(r) + ` status ${status}, asked ${asks}, zeros ${zeros}`;
  });
  check('cd_random_bytes: two fills differ, and len 0 asks for nothing and is OK', () => {
    x.t_random(16); x.t_random_new();
    x.t_random(16);
    const differs = x.t_random_new();
    asks.length = 0;
    const empty = x.t_random(0);
    const r = [differs === 1, empty === 1, asks.length === 0, x.t_random_guards() === 1];
    return r.every(Boolean) || JSON.stringify(r);
  });
  Crypto.prototype.getRandomValues = undefined;
  const unavailable = x.t_random(100);
  const untouched = x.t_random_zeros(0) === 100 && x.t_random_guards() === 1;
  Crypto.prototype.getRandomValues = realRandom;
  check('no crypto.getRandomValues: cd_random_bytes answers UNAVAILABLE and writes nothing', () =>
    (unavailable === 0 && untouched) || `answered ${unavailable}, untouched ${untouched}`);

  // The address (16 in unit.c): C pushes and replaces paths the page writes into its memory, and
  // hears back and forward.
  x.t_url_section();
  const startUrl = location.href;
  history.pushState(null, '', '#url'); // an entry of the page's own, so going back never leaves it
  const putPath = (s) => { const e = new TextEncoder().encode(s); new Uint8Array(x.memory.buffer, x.t_url_in(), e.length).set(e); return e.length; };
  const urlOut = (n) => new TextDecoder().decode(new Uint8Array(x.memory.buffer, x.t_url_out(), n));
  const urlHeard = () => new TextDecoder().decode(new Uint8Array(x.memory.buffer, x.t_url_heard(), x.t_url_heard_len()));
  const URL_PATH = 0, URL_SEARCH = 1, URL_HASH = 2, URL_ALL = 3;
  const replaced = x.t_url_replace(putPath('/unit.html?q=a%20b&r=1#frag-é'));
  check('cd_url_read: the path, the search and the hash, and all three as one path; a part longer than the room answers its length and writes only the room', () => {
    const read = (part) => urlOut(x.t_url_read(part, 256));
    const all = '/unit.html?q=a%20b&r=1#frag-%C3%A9';
    const short = x.t_url_read(URL_ALL, 5);
    const shortOut = urlOut(7);
    const r = [replaced === 1, read(URL_PATH) === '/unit.html', read(URL_SEARCH) === '?q=a%20b&r=1', read(URL_HASH) === '#frag-%C3%A9',
      read(URL_ALL) === all, short === all.length, shortOut === '/unit**'];
    x.t_url_replace(putPath('/unit.html'));
    const r2 = [x.t_url_read(URL_SEARCH, 256) === 0, x.t_url_read(URL_HASH, 256) === 0];
    return [...r, ...r2].every(Boolean) || JSON.stringify([...r, ...r2]) + ' ' + read(URL_ALL);
  });
  check('cd_url_push adds a history entry and cd_url_replace changes the current one; a relative path resolves; neither calls cd_on_url', () => {
    const entries = history.length;
    const pushed = x.t_url_push(putPath('/route/a'));
    const afterPush = [location.pathname, history.length];
    const replacedNow = x.t_url_replace(putPath('/route/b?x=1'));
    const afterReplace = [location.pathname + location.search, history.length];
    const relative = x.t_url_push(putPath('c#d'));
    const r = [pushed === 1, afterPush[0] === '/route/a', afterPush[1] === entries + 1, replacedNow === 1, afterReplace[0] === '/route/b?x=1',
      afterReplace[1] === entries + 1, relative === 1, location.pathname + location.hash === '/route/c#d', history.length === entries + 2, x.t_url_heard_count() === 0];
    return r.every(Boolean) || JSON.stringify(r) + ` ${afterPush} ${afterReplace} ${location.href} ${history.length - entries}`;
  });
  const popped = (n) => until(() => x.t_url_heard_count() === n, 2000);
  history.back();
  const back = await popped(1) && urlHeard();
  history.forward();
  const forward = await popped(2) && urlHeard();
  const anchor = document.createElement('a');
  anchor.href = '#here';
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  const fragment = await popped(3) && urlHeard();
  check('back, forward and a link to a #fragment reach cd_on_url with the new path, answered without a cd_flush', () =>
    (back === '/route/b?x=1' && forward === '/route/c#d' && fragment === '/route/c#here' && x.t_stale() === 0) || `back ${back}, forward ${forward}, fragment ${fragment}, stale ${x.t_stale()}`);
  check('cd_url_push refused (another origin, a SecurityError as Safari throws past its limit, a change the browser let go, no History API): REFUSED, the address as it was', () => {
    const was = location.href, entries = history.length;
    const realPush = History.prototype.pushState;
    const answers = [x.t_url_push(putPath('http://example.com/x')), x.t_url_replace(putPath('http://example.com/y'))];
    History.prototype.pushState = () => { throw new DOMException('too many', 'SecurityError'); };
    answers.push(x.t_url_push(putPath('/route/limit')));
    History.prototype.pushState = () => {};
    answers.push(x.t_url_push(putPath('/route/ignored')));
    History.prototype.pushState = undefined;
    answers.push(x.t_url_push(putPath('/route/none')));
    History.prototype.pushState = realPush;
    const r = [answers.every((a) => a === 0), location.href === was, history.length === entries];
    return r.every(Boolean) || JSON.stringify(r) + ` answers ${answers}, at ${location.href}`;
  });
  check('cd_set_title: the document\'s title, from UTF-8', () => {
    x.t_title(putPath('Ünit: cartes à jouer'));
    return document.title === 'Ünit: cartes à jouer' || document.title;
  });
  history.replaceState(null, '', startUrl);

  // Languages and display preferences (17 in unit.c); tools/unit.mjs changes the real media
  // queries from outside (CDP) once the page is done.
  x.t_locale_section();
  const langOut = (n) => new TextDecoder().decode(new Uint8Array(x.memory.buffer, x.t_lang_out(), n));
  const languages = (n) => { const tags = []; for (let i = 0; i < n; i++) { const len = x.t_language(i, 64); tags.push(len ? langOut(len) : 0); } return tags.join(); };
  const own = (name, value) => Object.defineProperty(navigator, name, { configurable: true, get: () => value });
  check('cd_language: the user\'s languages in their order, then 0 past the last; a tag longer than the room answers its length and writes only the room', () => {
    const real = languages(navigator.languages.length + 1) === [...navigator.languages, 0].join();
    own('languages', ['fr-CA', 'fr', 'en-GB']);
    const stubbed = languages(4);
    const cut = x.t_language(0, 2), cutOut = langOut(4);
    delete navigator.languages;
    const r = [real, stubbed === 'fr-CA,fr,en-GB,0', cut === 5, cutOut === 'fr**'];
    return r.every(Boolean) || JSON.stringify(r) + ` ${stubbed} ${cutOut} (real ${navigator.languages})`;
  });
  check('no navigator.languages (or an empty one): navigator.language alone; neither: 0 at once', () => {
    own('languages', undefined); own('language', 'de-AT');
    const single = languages(2);
    own('languages', []); own('language', 'pt');
    const empty = languages(2);
    own('language', undefined);
    const none = languages(1);
    delete navigator.languages; delete navigator.language;
    const r = [single === 'de-AT,0', empty === 'pt,0', none === '0'];
    return r.every(Boolean) || JSON.stringify(r) + ` ${single} / ${empty} / ${none}`;
  });
  check('cd_prefs: dark and reduced motion, each from its own media query; 0 without matchMedia', () => {
    const realMatchMedia = window.matchMedia;
    const real = x.t_prefs() === (matchMedia('(prefers-color-scheme: dark)').matches ? 1 : 0) + (matchMedia('(prefers-reduced-motion: reduce)').matches ? 2 : 0);
    const only = (query) => { window.matchMedia = (q) => ({ matches: q === query }); return x.t_prefs(); };
    const dark = only('(prefers-color-scheme: dark)'), reduced = only('(prefers-reduced-motion: reduce)');
    window.matchMedia = undefined;
    let none;
    try { none = x.t_prefs(); } catch (e) { none = String(e); }
    window.matchMedia = realMatchMedia;
    const r = [real, dark === 1, reduced === 2, none === 0];
    return r.every(Boolean) || JSON.stringify(r) + ` dark ${dark}, reduced ${reduced}, none ${none}`;
  });

  // The clipboard and the share sheet (18 in unit.c): navigator.share stubbed (headless Chrome has
  // no share sheet), the clipboard taken away; tools/unit.mjs writes the real clipboard, denied
  // and then granted by CDP, once the page is done.
  x.t_share_section();
  const SHARE_FAILED = 0, SHARE_DONE = 1, SHARE_UNAVAILABLE = 2, SHARE_CANCELLED = 3;
  const putShare = (ptr, s) => { const e = new TextEncoder().encode(s); new Uint8Array(x.memory.buffer, ptr, e.length).set(e); return e.length; };
  const scribble = () => { new Uint8Array(x.memory.buffer, x.t_share_text(), 256).fill(42); new Uint8Array(x.memory.buffer, x.t_share_url(), 256).fill(42); };
  // Each ask: [status right after the call, status once answered, answers], or what it threw.
  const shareAsk = async (token, ask, status, answers) => {
    try { ask(); } catch (e) { return [String(e)]; }
    scribble();
    const now = status(token);
    await until(() => status(token) !== -1, 1000);
    await sleep(20);
    return [now, status(token), answers(token)];
  };
  const clip = (token, text) => shareAsk(token, () => x.t_clipboard(token, putShare(x.t_share_text(), text)), x.t_clipboard_status, x.t_clipboard_answers);
  const sharing = (token, title, url) => shareAsk(token, () => x.t_share(token, putShare(x.t_share_text(), title), putShare(x.t_share_url(), url)), x.t_share_status, x.t_share_answers);
  own('clipboard', undefined);
  const noClipboard = await clip(1, 'gone');
  delete navigator.clipboard;
  check('no navigator.clipboard (an insecure page): cd_clipboard_write answers UNAVAILABLE once, from the event loop, and the export flushes', () =>
    (noClipboard.join() === `-1,${SHARE_UNAVAILABLE},1` && x.t_stale() === 0) || `${noClipboard}, stale ${x.t_stale()}`);
  own('share', undefined);
  const noShare = await sharing(1, 'Ünit', '/cards/7');
  const shared = [];
  const shareThen = (outcome) => own('share', (data) => { shared.push(data); return outcome(); });
  shareThen(() => Promise.resolve());
  const done = await sharing(2, 'Ünit: cartes à jouer', '/cards/7?deck=red');
  const titleOnly = await sharing(3, 'Ünit', '');
  const urlOnly = await sharing(4, '', 'https://example.com/a');
  shareThen(() => Promise.reject(new DOMException('closed', 'AbortError')));
  const cancelled = await sharing(5, 'Ünit', '/cards/7');
  shareThen(() => Promise.reject(new DOMException('no gesture', 'NotAllowedError')));
  const refused = await sharing(6, 'Ünit', '/cards/7');
  shareThen(() => Promise.reject(new TypeError('nothing to share')));
  const invalid = await sharing(7, '', '');
  delete navigator.share;
  check('no navigator.share (headless, most desktop browsers): cd_share answers UNAVAILABLE once, from the event loop', () =>
    noShare.join() === `-1,${SHARE_UNAVAILABLE},1` || String(noShare));
  check('cd_share: the title and the url, read during the call, each left out when empty; DONE once, from the event loop, and the export flushes', () => {
    const data = shared.slice(0, 3).map((d) => JSON.stringify(d)).join(' ');
    const r = [done.join() === `-1,${SHARE_DONE},1`, titleOnly.join() === `-1,${SHARE_DONE},1`, urlOnly.join() === `-1,${SHARE_DONE},1`,
      data === '{"title":"Ünit: cartes à jouer","url":"/cards/7?deck=red"} {"title":"Ünit"} {"url":"https://example.com/a"}', x.t_stale() === 0];
    return r.every(Boolean) || JSON.stringify(r) + ` ${done} / ${titleOnly} / ${urlOnly}: ${data}`;
  });
  check('cd_share: the sheet closed (AbortError) answers CANCELLED; refused (NotAllowedError) or invalid (TypeError) answers FAILED', () => {
    const r = [cancelled.join() === `-1,${SHARE_CANCELLED},1`, refused.join() === `-1,${SHARE_FAILED},1`, invalid.join() === `-1,${SHARE_FAILED},1`];
    return r.every(Boolean) || JSON.stringify(r) + ` ${cancelled} / ${refused} / ${invalid}`;
  });
}).catch((e) => errors.push('start: ' + e)).finally(() => { window.RESULT = { errors, passed }; });
</script></body></html>
