<!doctype html><html><head><meta charset="utf-8"><title>legacy</title></head><body><div id="m"></div>
<script src="cdom.js"></script>
<script>
/*CDOM_BOOT*/

<script>
// Written in ES5 like the code it tests: with LEGACY=1 the page has none of what the polyfills supply.
var LOG = [], ERRORS = [];
window.addEventListener('error', function (e) { ERRORS.push(e.error ? e.error.name + ': ' + e.error.message : String(e.message)); });
var env = { ev: function (t, id, x, y, p, b) { LOG.push([t, id >>> 0, x, y, p, b]); } };
cdomBoot('legacy.wasm', document.getElementById('m'), env, function (x) { window.X = x; window.READY = true; });
</script></body></html>
