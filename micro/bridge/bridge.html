<!doctype html>
<html><head><meta charset="utf-8"><title>cdom bridge micro</title>
<script>
/*CDOM_SHIM*/
</script></head>
<body><div id="main"></div>
<script>
// Each kind runs N operations of bridge.c inside one export (bench_run); the page reports ns per
// operation, the median of R runs after warm-up runs (every path to its top tier). ?count=1 (the
// counting build) runs each kind once with N = 1000 and reports import calls and strings per operation.
const KINDS = ['style_num', 'style_tmp', 'set_text', 'attr', 'mount', 'clone', 'ghost', 'frame', 'now'];
const q = new URLSearchParams(location.search);
const N = +(q.get('n') || 20000), R = +(q.get('r') || 15), COUNT = q.get('count') === '1';
cdom.start('bridge.wasm', 'main').then(async (x) => {
  const out = {};
  const target = document.querySelector('#main > div');
  const click = new MouseEvent('click', { bubbles: true });
  const events = (n) => { for (let i = 0; i < n; i++) target.dispatchEvent(click); };
  if (COUNT) {
    const cross = globalThis.__cdomCross;
    const total = () => Object.entries(cross).reduce((a, [k, v]) => (k[0] === '$' ? a : a + v), 0);
    for (let k = 0; k < KINDS.length; k++) {
      const c0 = total(), s0 = cross.$strings | 0, r0 = cross.$records | 0;
      x.bench_run(k, 1000);
      out[KINDS[k]] = { crossings: (total() - c0) / 1000, strings: ((cross.$strings | 0) - s0) / 1000, records: ((cross.$records | 0) - r0) / 1000 };
    }
    const c0 = total(), s0 = cross.$strings | 0;
    events(1000);
    out.event = { crossings: (total() - c0) / 1000, strings: ((cross.$strings | 0) - s0) / 1000, records: 0 };
    window.RESULT = out;
    return;
  }
  const time = (f, n) => { const v = []; for (let r = 0; r < R; r++) { const t = performance.now(); f(n); v.push((performance.now() - t) * 1e6 / n); }
    v.sort((a, b) => a - b); return +v[R >> 1].toFixed(1); };
  for (let w = 0; w < 3; w++) { for (let k = 0; k < KINDS.length; k++) x.bench_run(k, N / 4); events(N / 4); }
  for (let k = 0; k < KINDS.length; k++) {
    const n = KINDS[k] === 'mount' || KINDS[k] === 'clone' || KINDS[k] === 'frame' ? N / 4 : N;
    out[KINDS[k]] = time((m) => x.bench_run(k, m), n);
    await new Promise((r) => setTimeout(r, 0)); // let rendering of the writes happen off the clock
  }
  x.bench_prevent(1);
  out.event = time(events, N / 4);
  if (x.bench_events() === 0) throw new Error('no events reached C');
  window.RESULT = out;
}).catch((e) => { window.RESULT = { error: String(e && e.stack || e) }; });
</script></body></html>
