<!doctype html><html><head><meta charset="utf-8"></head><body><div id="m"></div><script src="SHIM"></script><script>
cdom.start('open.wasm', 'm').then((x) => {
  const t = [];
  for (let r = 0; r < 31; r++) { const a = performance.now(); x.rows(20000); t.push(performance.now() - a); }
  const w = t.slice(5).sort((a, b) => a - b);
  window.RESULT = w[w.length >> 1];
});
</script></body></html>
