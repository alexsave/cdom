<!doctype html><html><head><meta charset="utf-8"><title>chunked</title></head><body><div id="m"></div>

</script>
<script>
// bench/chunked/run.mjs drives this page (bench/chunked/app.c): once a file is picked, ARM (set by the driver) starts
// at the input's change, the time T0 (performance.now(), cd_now()'s clock); the app records the end.
cdom.start(/*CDOM_WASM*/, 'm').then((x) => {
    window.X = x;
    document.getElementById('pick').addEventListener('change', () => { window.T0 = performance.now(); X.go(window.ARM); });
    window.READY = true;
});
</script></body></html>
