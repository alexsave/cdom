// bench/plainc/micro.c through one of the string resolvers below. Query: build=base|ro, opt=today|romap|
// roarr|roobj|val|shimro|ptr, test=lit8|tern8|terns8|help8|buf1|bufnew, len=bytes.

const td = new TextDecoder(), F = String.fromCharCode;

    case 0: return v;
    case 1: return v + F(b[p]);
    case 2: return v + F(b[p], b[p + 1]);
    case 3: return v + F(b[p], b[p + 1], b[p + 2]);
    case 4: return v + F(b[p], b[p + 1], b[p + 2], b[p + 3]);
    case 5: return v + F(b[p], b[p + 1], b[p + 2], b[p + 3], b[p + 4]);
    case 6: return v + F(b[p], b[p + 1], b[p + 2], b[p + 3], b[p + 4], b[p + 5]);

    for (let k = 0; k < n; k++) high |= u8[p + k];

// today's str(): a slot, or a record read on use
function record(s) {

let roArr = [], roObj = {};

    const b = e.b;

    while (k < n && u8[p + k] === b[k]) k++;

  // rodata pointers are ids (C, -DCDOM_RO=1): a Map by address; slots lie above the read-only data
  romap(s) {

    return runtime(s);
  },
  // the same, an array indexed by the offset into the read-only data, made that long at start
  roarr(s) {
    if (s >= litBase) return lits[(s - litBase) >> 2];
    if (s > 0) { let v = roArr[s - roBase]; if (v === undefined) { if (u8.length === 0) views(); roArr[s - roBase] = v = cString(s); } return v; }
    return runtime(s);
  },
  // the same, a plain object keyed by address (what a browser without Map would run)
  roobj(s) {
    if (s >= litBase) return lits[(s - litBase) >> 2];
    if (s > 0) { let v = roObj[s]; if (v === undefined) { if (u8.length === 0) views(); roObj[s] = v = cString(s); } return v; }
    return runtime(s);
  },
  // the same, a 256-entry direct-mapped cache by the address's low bits in front of the Map: fixed memory
  rodm(s) {
    if (s >= litBase) return lits[(s - litBase) >> 2];

  // C unchanged; the shim tests the record's pointer against the read-only range and caches those by address

  recWords = u32[at++] >> 2; recP = u32[at++] >> 2; recLen = u32[at++] >> 2;

  roBase = exports.ro0(); roEnd = exports.ro1();

  roArr = new Array(roEnd - roBase);

  const go = per === 1 ? (n) => exports[test](n, len) : (n) => exports[test](n);
  const sample = (n) => { const t0 = performance.now(); go(n); return performance.now() - t0; };
  // correctness: the strings this resolver returns for one pass of the test, to compare across resolvers
  const seen = []; const keep = mine.text; mine.text = (s) => { seen.push(resolve(s)); }; go(3); mine.text = keep;
  let n = 64;
  for (let i = 0; i < 4; i++) sample(n);
  while (sample(n) < 10 && n < 1 << 26) n *= 2;
  for (let i = 0; i < 5; i++) sample(n);
  const v = [];
  for (let i = 0; i < 21; i++) v.push(sample(n) * 1e6 / (n * per));
  const s = [...v].sort((a, b) => a - b);

}
run().catch((e) => { window.RESULT = { error: String(e.stack || e) }; });
